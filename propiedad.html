<!doctype html>
<html lang="es-PY">
<head>
<title>Propiedad en alquiler | Brickroga</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<meta name="description" content="Ficha de propiedad de Brickroga: precio, fotos, comodidades y ubicación. Coordiná tu visita por WhatsApp.">
<link rel="canonical" href="https://www.brickroga.com/alquileres.html">
<meta name="robots" content="noindex, follow">
</head>
<body data-page="alquileres" data-dyn-title>
<header id="site-header"></header>
<main class="wrap" id="main"></main>
<footer id="site-footer"></footer>
<script src="data/datos.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/iconos.js"></script>
<script src="assets/app.js"></script>
<script>
  function show() {
    const fixed = document.body.dataset.prop;
    const id = fixed || (location.hash || "").slice(1) || (new URLSearchParams(location.search).get("id")) || "";
    const all = BRK.visibles();
    const p = all.find(x => x.id === id) || all.find(x => x.id.startsWith(id + "-")) || all[0];
    /* old links (propiedad.html#id) go to the listing's own page */
    if (!fixed && p.slug) { location.replace(p.slug + ".html" + location.search); return; }
    const E = BRK.esc, M = n => BRK.money(p.moneda, n), K = p.contacto || { nombre: "", numero: BRK.WA.numero, visible: BRK.WA.visible };
    const T = x => window.BRK_I18N ? BRK_I18N.tr(x) : x;
    /* listing pages already ship an SEO title and description in Spanish; only rewrite them in English or on the generic page */
    const keepHead = fixed && !(window.BRK_I18N && BRK_I18N.lang === "en");
    if (!keepHead) document.title = T(p.titulo + ", " + p.ciudad) + " | Brickroga";
    const md = keepHead ? null : document.querySelector('meta[name="description"]');
    if (md) md.content = (p.ideal_para ? p.ideal_para + " " : "") + p.titulo + ", " + p.barrio + ", " + p.ciudad + (p.precio ? ". " + M(p.precio) + " por " + p.periodo + "." : ".");
    const msg = "Hola Brickroga, me interesa " + (p.codigo ? "la propiedad " + p.codigo + ", " : "") + "\"" + p.titulo + "\"" + (p.precio ? " (" + M(p.precio) + " por " + p.periodo + ")" : "") + ". ¿Puedo coordinar una visita?";
    const wa = BRK.waLink(msg, K.numero);
    const estado = p.estado === "disponible" ? '<span class="chip chip-ok">Disponible</span>' : '<span class="chip chip-ej">' + E(p.estado) + '</span>';
    const fotos = (p.fotos || []).length ? p.fotos.map((s, i) => `<img src="${E(s)}" alt="${E(p.titulo)} en ${E(p.ciudad)}, Paraguay, foto ${i + 1}" loading="${i < 3 ? "eager" : "lazy"}">`).join("")
      : [0, 1, 2].map(() => '<div class="card-photo" style="aspect-ratio:9/16">' + BRK.photo(p) + '</div>').join("");
    const facts = [];
    if (p.tipo !== "Terreno") facts.push(p.dormitorios ? [p.dormitorios, p.dormitorios === 1 ? "dormitorio" : "dormitorios"] : ["Mono", "ambiente"]);
    if (p.banos) facts.push([p.banos, p.banos === 1 && (p.comodidades || []).includes("bano_privado") ? "baño privado" : p.banos === 1 ? "baño" : "baños"]);
    if (p.huespedes) facts.push([p.huespedes, "huéspedes"]);
    facts.push([p.m2 ? p.m2 + " m²" : "—", "superficie"]);
    if (!p.huespedes) facts.push([p.codigo || "—", "código"]);
    const mapq = p.lat ? p.lat + "," + p.lng : p.mapa_q || "";
    /* Asunción listings show the route to Paseo La Galería as the reference point; others only show the place */
    const REF = "Paseo La Galería", ref = !p.mapa_solo && p.ciudad === "Asunción" && p.lat ? (p.ref_mapa || REF) : "";
    const refNear = ref && (p.cerca || []).find(c => c.lugar === ref);
    const mapSrc = ref ? `https://maps.google.com/maps?saddr=${encodeURIComponent(mapq)}&daddr=${encodeURIComponent(ref + ", Asunción, Paraguay")}&hl=es&output=embed`
      : `https://maps.google.com/maps?q=${encodeURIComponent(mapq)}&z=${p.lat ? 15 : 13}&hl=es&output=embed`;
    const ivisit = p.operacion === "Alquiler temporario" ? "Consultar fechas y tarifa" : "Coordinar una visita";
    document.getElementById("main").innerHTML = `
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a> / <a href="alquileres.html">Propiedades</a> / <a href="alquileres.html?ciudad=${encodeURIComponent(p.ciudad)}">${E(p.ciudad)}</a> / ${E(p.codigo || p.barrio)}</nav>
      <div class="strip" tabindex="0" aria-label="Fotos">${fotos}</div>
      ${p.fotos_nota ? `<p class="foto-nota">${E(p.fotos_nota)}</p>` : ""}
      <div class="detail">
        <div style="min-width:0">
          <div style="display:flex;gap:6px;flex-wrap:wrap">${estado}<span class="chip chip-orange">${E(p.operacion)}</span><span class="chip" style="background:var(--concrete)">${E(p.tipo)}</span>${p.ejemplo ? '<span class="chip chip-ej">Datos de ejemplo</span>' : ""}</div>
          <h1 style="font-size:clamp(1.8rem,3.6vw,2.7rem);margin-top:12px">${E(p.titulo)}</h1>
          <p class="loc" style="margin-top:8px">${BRK_ICONS.pin}${E(p.barrio)}, ${E(p.ciudad)}</p>
          ${p.resenas ? `<p class="rating" style="margin-top:8px"><span class="stars">★</span>${String(p.resenas.nota).replace(".", ",")} · ${p.resenas.cantidad} reseñas en ${E(p.resenas.fuente)}</p>${p.resenas.detalle ? `<p class="muted" style="font-size:.88rem;margin-top:2px">${E(p.resenas.detalle)}</p>` : ""}` : ""}
          <div class="only-m">${BRK.cartel(p)}<a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">${BRK_ICONS.wa}${ivisit}</a></div>
          <div class="facts">${facts.map(f => `<div class="fact"><b>${E(f[0])}</b><span>${f[1]}</span></div>`).join("")}</div>
          ${p.ideal_para ? `<p class="ideal">${E(p.ideal_para)}</p>` : ""}
          ${p.secciones && p.secciones.length ? `<div class="blocks" style="margin-top:26px">${p.secciones.map(b => `<div class="block"><span class="e" aria-hidden="true">${BRK_ICO(b.e)}</span><h3>${E(b.titulo)}</h3><p>${E(b.texto)}</p></div>`).join("")}</div>` : ""}
          <h2 style="font-size:1.35rem;margin-top:32px">Qué tiene</h2>
          <div class="ams-big">${BRK.amen(p)}</div>
          <p style="max-width:66ch;margin-top:20px" class="muted">${E(p.descripcion)}</p>
          ${p.nota ? `<div class="nota"><b>${E(p.nota.titulo)}</b><p>${E(p.nota.texto)}</p></div>` : ""}
          <h2 style="font-size:1.35rem;margin-top:32px">Ubicación</h2>
          <div class="addr">${p.direccion ? `<b>${E(p.direccion)}</b>` : `<b>${E(p.barrio)}, ${E(p.ciudad)}</b>`}${p.maps ? `<a href="${E(p.maps)}" target="_blank" rel="noopener">Ver en Google Maps →</a>` : ""}</div>
          ${refNear ? `<p class="map-ref">${BRK_ICO("car")}<span>${refNear.min} min en auto hasta ${E(ref)} · ${String(refNear.km).replace(".", ",")} km</span></p>` : ""}
          ${mapq ? `<div class="map-embed"><iframe title="Mapa: ${E(p.barrio)}, ${E(p.ciudad)}" src="${mapSrc}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>${p.mapa_aprox ? '<p class="muted" style="font-size:.85rem;margin-top:8px">Ubicación aproximada. Te pasamos la dirección exacta al confirmar la reserva.</p>' : ""}` : ""}
          ${p.cerca_lista ? `<ul class="near-list">${p.cerca_lista.map(c => { const s = BRK_ICO_SPLIT(c); return `<li>${s[0]}<span>${E(s[1])}</span></li>`; }).join("")}</ul>` : ""}
          ${p.cerca && p.cerca.length ? `<div class="near">${p.cerca.map(c => `<div><b>${E(c.lugar)}</b><span>${String(c.km).replace(".", ",")} km</span><span>~${c.min} min en auto</span></div>`).join("")}</div>
          <p class="muted" style="font-size:.85rem;margin-top:8px">Distancia en línea recta. Tiempos en auto, sin mucho tráfico.</p>` : ""}
          ${p.video || (p.mapa && !mapq) ? `<h2 style="font-size:1.35rem;margin-top:32px">${p.video_titulo ? E(p.video_titulo) : "Recorrido"}</h2>
          <div class="media-row">
            ${p.video ? `<div class="video-wrap"><video data-auto controls muted loop playsinline preload="metadata" poster="${E(p.video_poster || "")}" src="${E(p.video)}"></video></div>` : ""}
            ${p.mapa && !mapq ? `<figure style="margin:0"><img src="${E(p.mapa)}" alt="Mapa de la zona de ${E(p.barrio)}" loading="lazy"><figcaption class="muted" style="font-size:.8rem;margin-top:6px">© OpenStreetMap</figcaption></figure>` : ""}
          </div>` : ""}
        </div>
        <aside class="price-box" aria-label="Precio">
          ${BRK.cartel(p)}
          <dl>
            ${p.precio ? `<dt>${p.periodo === "noche" ? "Tarifa por noche" : "Alquiler"}</dt><dd>${M(p.precio)}</dd>` : `<dt>Tarifa</dt><dd>Consultá según fechas</dd>`}
            ${p.precio_usd_aprox ? `<dt>Aproximado en dólares</dt><dd>USD ${BRK.fmt(p.precio_usd_aprox)}</dd>` : ""}
            ${p.operacion === "Alquiler" ? `<dt>Gastos comunes</dt><dd>${p.gastos_comunes ? M(p.gastos_comunes) : "No tiene"}</dd>` : ""}
            ${p.codigo ? `<dt>Código</dt><dd>${E(p.codigo)}</dd>` : ""}
          </dl>
          ${p.precio_nota ? `<p class="muted" style="font-size:.85rem">${E(p.precio_nota)}</p>` : ""}
          ${p.incluye ? `<p class="incl-box"><b>Incluido:</b> ${E(p.incluye)}</p>` : ""}
          <a class="btn btn-wa" href="${wa}" target="_blank" rel="noopener">${BRK_ICONS.wa}${ivisit}</a>
          ${p.airbnb ? `<a class="btn btn-line" href="${E(p.airbnb)}" target="_blank" rel="noopener">Ver disponibilidad en Airbnb</a>` : ""}
          <p class="muted" style="font-size:.85rem">${K.nombre ? "Coordiná con " + E(K.nombre) + " · " : ""}WhatsApp ${E(K.visible)}</p>
        </aside>
      </div>
      ${(() => { const more = BRK.visibles().filter(x => x.id !== p.id).slice(0, 3); return more.length ? `<section style="padding-bottom:64px"><div class="section-head"><h2 style="font-size:1.6rem">Otras propiedades</h2><a class="link" href="alquileres.html">Ver todas →</a></div><div class="grid">${more.map(BRK.card).join("")}</div></section>` : ""; })()}`;
    window.scrollTo(0, 0);
    if (window.BRK_VIDEOS_READY) BRK_VIDEOS_READY();
  }
  addEventListener("hashchange", show); show();
</script>
</body>
</html>
