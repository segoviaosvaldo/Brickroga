<!doctype html>
<html lang="es-PY">
<head>
<title>Departamento en alquiler | Brickroga</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E2240">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<meta name="description" content="Ficha de alquiler en Asunción con precio, gastos comunes, fotos y características. Consultá por WhatsApp.">
</head>
<body data-page="alquileres">
<header id="site-header"></header>
<main class="wrap" id="main"></main>
<footer id="site-footer"></footer>
<script src="data/datos.js"></script>
<script src="assets/app.js"></script>
<script>
  function show() {
    const id = (location.hash || "").slice(1) || (new URLSearchParams(location.search).get("id")) || "";
    const all = BRICKROGA.propiedades;
    const p = all.find(x => x.id === id) || all[0];
    const E = BRK.esc, M = n => BRK.money(p.moneda, n);
    document.title = p.titulo + " en " + p.ciudad + " | Brickroga";
    const msg = "Hola Brickroga, me interesa \"" + p.titulo + "\" (" + M(p.precio) + "/" + p.periodo + "). ¿Puedo coordinar una visita?";
    const estado = p.estado === "disponible" ? '<span class="chip chip-ok">Disponible</span>' : '<span class="chip chip-ej">' + E(p.estado) + '</span>';
    document.getElementById("main").innerHTML = `
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a> / <a href="alquileres.html">Alquileres</a> / ${E(p.titulo)}</nav>
      <div class="detail">
        <div style="min-width:0">
          <div class="gallery">${[0,1,2].map(i => '<div class="ph">' + BRK.photo(p, i, i ? "" : "Fotos próximamente") + '</div>').join("")}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px">${estado}<span class="chip chip-op">${E(p.operacion)}</span>${p.ejemplo ? '<span class="chip chip-ej">Datos de ejemplo</span>' : ""}</div>
          <h1 style="font-size:clamp(1.5rem,3vw,2.1rem);margin-top:10px">${E(p.titulo)}</h1>
          <p class="loc" style="margin-top:6px">${BRK_ICONS.pin}${E(p.barrio)}, ${E(p.ciudad)}</p>
          <div class="facts">
            <div class="fact"><b>${p.dormitorios || "Mono"}</b><span>${p.dormitorios ? "dormitorios" : "ambiente"}</span></div>
            <div class="fact"><b>${p.banos}</b><span>baño${p.banos > 1 ? "s" : ""}</span></div>
            <div class="fact"><b>${p.m2} m²</b><span>superficie</span></div>
            <div class="fact"><b>${p.cochera || "No"}</b><span>cochera</span></div>
          </div>
          <h2 style="font-size:1.25rem">Descripción</h2>
          <p class="muted" style="margin-top:8px;max-width:68ch">${E(p.descripcion)}</p>
          <h2 style="font-size:1.25rem;margin-top:26px">Características</h2>
          <ul class="feat">${p.caracteristicas.map(c => "<li>" + E(c) + "</li>").join("")}<li>${p.amoblado ? "Amoblado" : "Sin amoblar"}</li><li>${p.mascotas ? "Acepta mascotas" : "Sin mascotas"}</li></ul>
        </div>
        <aside class="price-box" aria-label="Precio">
          <span class="muted" style="font-size:.85rem">Alquiler mensual</span>
          <div class="price">${M(p.precio)}</div>
          <dl>
            <dt>Alquiler</dt><dd>${M(p.precio)}</dd>
            <dt>Gastos comunes</dt><dd>${p.gastos_comunes ? M(p.gastos_comunes) : "Incluidos"}</dd>
            <dt class="total">Total por mes</dt><dd class="total">${M(p.precio + (p.gastos_comunes || 0))}</dd>
          </dl>
          <a class="btn btn-wa" href="${BRK.waLink(msg)}" target="_blank" rel="noopener">${BRK_ICONS.wa}Consultar por WhatsApp</a>
          <p class="muted" style="font-size:.82rem">WhatsApp ${E(BRICKROGA.config.whatsapp_visible)}. Respondemos el mismo día.</p>
        </aside>
      </div>`;
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", show); show();
</script>
</body>
</html>
