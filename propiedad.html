<!doctype html>
<html lang="es-PY">
<head>
<title>Monoambiente amoblado en Santa María, Asunción | Brickroga</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#111111">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/styles.css">
<meta name="description" content="Monoambiente amoblado en alquiler en Santa María, Asunción. Gs. 2.500.000 por mes con internet, agua, basura y luz incluidos. Fotos reales y video.">
<link rel="canonical" href="https://www.brickroga.com/propiedad.html">
</head>
<body data-page="alquileres">
<header id="site-header"></header>
<main class="wrap" id="main"></main>
<footer id="site-footer"></footer>
<script src="data/datos.js"></script>
<script src="assets/i18n.js"></script>
<script src="assets/app.js"></script>
<script>
  function show() {
    const id = (location.hash || "").slice(1) || (new URLSearchParams(location.search).get("id")) || "";
    const all = BRICKROGA.propiedades;
    const p = all.find(x => x.id === id) || all[0];
    const E = BRK.esc, M = n => BRK.money(p.moneda, n);
    document.title = p.titulo + ", " + p.ciudad + " | Brickroga";
    const msg = "Hola Brickroga, me interesa \"" + p.titulo + "\" (" + M(p.precio) + " por " + p.periodo + "). ¿Puedo coordinar una visita?";
    const estado = p.estado === "disponible" ? '<span class="chip chip-ok">Disponible</span>' : '<span class="chip chip-ej">' + E(p.estado) + '</span>';
    const fotos = (p.fotos || []).length ? p.fotos.map((s, i) => `<img src="${E(s)}" alt="${E(p.titulo)}, foto ${i + 1}" loading="${i < 3 ? "eager" : "lazy"}">`).join("")
      : [0,1,2].map(() => '<div class="card-photo" style="aspect-ratio:9/16">' + BRK.photo(p) + '</div>').join("");
    const facts = [
      [p.dormitorios || "Mono", p.dormitorios ? "dormitorios" : "ambiente"],
      [p.banos, "baño" + (p.banos > 1 ? "s" : "") + (p.caracteristicas.includes("Baño privado") ? " privado" : "")],
      [p.m2 ? p.m2 + " m²" : "—", "superficie"],
      [p.unidades_disponibles || 1, "disponibles"]
    ];
    document.getElementById("main").innerHTML = `
      <nav class="crumbs" aria-label="Ruta"><a href="index.html">Inicio</a> / <a href="alquileres.html">Alquileres</a> / ${E(p.barrio)}</nav>
      <div class="strip" tabindex="0" aria-label="Fotos">${fotos}</div>
      <div class="detail">
        <div style="min-width:0">
          <div style="display:flex;gap:6px;flex-wrap:wrap">${estado}${p.amoblado ? '<span class="chip" style="background:var(--concrete)">Amoblado</span>' : ""}${p.ejemplo ? '<span class="chip chip-ej">Datos de ejemplo</span>' : ""}</div>
          <h1 style="font-size:clamp(1.8rem,3.6vw,2.7rem);margin-top:12px">${E(p.titulo)}</h1>
          <p class="loc" style="margin-top:8px">${BRK_ICONS.pin}${E(p.barrio)}, ${E(p.ciudad)}</p>
          <div class="only-m">${BRK.cartel(p)}<a class="btn btn-wa" href="${BRK.waLink(msg)}" target="_blank" rel="noopener">${BRK_ICONS.wa}Coordinar una visita</a></div>
          <div class="facts">${facts.map(f => `<div class="fact"><b>${f[0]}</b><span>${f[1]}</span></div>`).join("")}</div>
          <p style="max-width:66ch">${E(p.descripcion)}</p>
          <h2 style="font-size:1.35rem;margin-top:32px">Qué tiene</h2>
          <ul class="feat">${p.caracteristicas.map(c => "<li>" + E(c) + "</li>").join("")}</ul>
          ${p.cerca && p.cerca.length ? `<h2 style="font-size:1.35rem;margin-top:32px">Qué queda cerca</h2>
          <div class="near">${p.cerca.map(c => `<div><b>${E(c.lugar)}</b><span>${String(c.km).replace(".", ",")} km</span><span>~${c.min} min en auto</span></div>`).join("")}</div>
          <p class="muted" style="font-size:.85rem;margin-top:8px">Distancia en línea recta. Tiempos en auto, sin mucho tráfico.</p>` : ""}
          ${p.video || p.mapa ? `<h2 style="font-size:1.35rem;margin-top:32px">Recorrido y ubicación</h2>
          <div class="media-row">
            ${p.video ? `<div class="video-wrap"><video controls playsinline preload="none" poster="${E(p.video_poster || "")}" src="${E(p.video)}"></video></div>` : ""}
            ${p.mapa ? `<figure style="margin:0"><img src="${E(p.mapa)}" alt="Mapa de la zona de ${E(p.barrio)}" loading="lazy"><figcaption class="muted" style="font-size:.8rem;margin-top:6px">© OpenStreetMap</figcaption></figure>` : ""}
          </div>` : ""}
        </div>
        <aside class="price-box" aria-label="Precio">
          ${BRK.cartel(p)}
          <dl>
            <dt>Alquiler</dt><dd>${M(p.precio)}</dd>
            ${p.precio_usd_aprox ? `<dt>Aproximado en dólares</dt><dd>USD ${BRK.fmt(p.precio_usd_aprox)}</dd>` : ""}
            <dt>Gastos comunes</dt><dd>${p.gastos_comunes ? M(p.gastos_comunes) : "No tiene"}</dd>
          </dl>
          ${p.incluye ? `<p class="incl-box"><b>Incluido:</b> ${E(p.incluye)}</p>` : ""}
          <a class="btn btn-wa" href="${BRK.waLink(msg)}" target="_blank" rel="noopener">${BRK_ICONS.wa}Coordinar una visita</a>
          <p class="muted" style="font-size:.85rem">WhatsApp ${E(BRK.WA.visible)}</p>
        </aside>
      </div>`;
    window.scrollTo(0, 0);
  }
  addEventListener("hashchange", show); show();
</script>
</body>
</html>
